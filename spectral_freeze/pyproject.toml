[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-freeze"
version = "1.0.0"
description = "Real-time STFT/phase-vocoder spectral freeze effect with editing GUI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "PySide6>=6.6",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["spectral_freeze*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
